# Builds, signs, notarizes and publishes Skill Bridge when a version tag is pushed:
#
#   git tag v2.3 && git push origin v2.3
#
# Needs these repository secrets (see "Releasing" in the README):
#   DEVELOPER_ID_P12           the Developer ID Application certificate, exported as .p12, base64
#   DEVELOPER_ID_P12_PASSWORD  the password chosen when exporting it
#   SIGN_IDENTITY              e.g. Developer ID Application: Your Name (TEAMID)
#   APPLE_ID                   the Apple ID used for notarization
#   APPLE_TEAM_ID              the team ID
#   APPLE_APP_PASSWORD         an app-specific password for that Apple ID

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # A release published by hand for this tag already exists: nothing to do.
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Import the signing certificate into a temporary keychain
        if: steps.existing.outputs.skip != 'true'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Save the notarization login
        if: steps.existing.outputs.skip != 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"

      - name: Build, sign and notarize
        if: steps.existing.outputs.skip != 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: |
          printf 'SIGN_IDENTITY="%s"\nNOTARY_PROFILE=notary\nNOTARY_KEYCHAIN="%s"\n' "$SIGN_IDENTITY" "$KEYCHAIN" > .signing.env
          ./build.sh --release
          shasum -a 256 build/Skill-Bridge.zip

      - name: Publish the release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Skill-Bridge.zip --title "Skill Bridge ${GITHUB_REF_NAME#v}" --generate-notes
